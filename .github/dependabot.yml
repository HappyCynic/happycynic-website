# Weekly update pull requests. github-actions also bumps the pinned SHA of the shared agent
# pipeline (HappyCynic/.github). Only releases out for two weeks are proposed (cooldown).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: devcontainers
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
